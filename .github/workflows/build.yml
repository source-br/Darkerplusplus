name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ex: v0.1.0-beta)'
        required: true
        default: 'v0.1.0-beta'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Set version env
        run: echo "HAMMERFY_VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV

      - name: Update version in core/version.py
        run: |
          (Get-Content core\version.py) -replace '__version__ = ".*"', '__version__ = "${{ github.event.inputs.version }}"' -replace 'DEV_MODE = True', 'DEV_MODE = False' | Set-Content core\version.py

      - name: Build EXE
        run: |
          pyinstaller hammerfy.spec
          pyinstaller --onefile --noconsole --name HammerfyUpdater --icon assets/icons/hammerfy-icon.ico updater_app.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Update version in ISS
        run: |
          (Get-Content installer\hammerfy.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ github.event.inputs.version }}"' | Set-Content installer\hammerfy.iss

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\hammerfy.iss

      - name: List output files
        run: Get-ChildItem -Recurse -Filter "*.exe" D:\a\hammerfy\hammerfy\installer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Hammerfy ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: installer/output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}